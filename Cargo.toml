# ──────────────────────────────────────────────────────────────────────
# Cargo.toml — Virtual workspace root for the Autonomous Browser Harness
# ──────────────────────────────────────────────────────────────────────

[workspace]
resolver = "2"
members = [
    "crates/harness-core",
    "crates/harness-browser",
    "crates/harness-agent",
    "crates/harness-tui",
    "crates/harness-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Harness Engineering"]
description = "High-Performance Autonomous Browser Harness"

[workspace.dependencies]
# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Cryptography
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# Hashing
twox-hash = "2"

# Concurrent data structures
dashmap = "6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
