[package]
name = "harness-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Glitch-free immediate-mode terminal UI, slash-command parser, embedded Axum server, and Arrow/Parquet exporter."
default-run = "harness"

[lib]
name = "harness_tui"
path = "src/lib.rs"

[[bin]]
name = "harness"
path = "src/bin/harness.rs"

[[bin]]
name = "harness-tui"
path = "src/bin/harness_tui.rs"

[dependencies]
harness-core = { path = "../harness-core" }
harness-browser = { path = "../harness-browser" }
harness-agent = { path = "../harness-agent" }

# TUI & Terminal
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Embedded Axum REST API
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Arrow & Parquet & CSV Exporter
arrow = "54"
parquet = { version = "54", features = ["snap"] }
csv = "1.3"
url = "2"

# Serialization & Database
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }

# Async runtime & Channels
tokio = { workspace = true }
futures = "0.3"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }

# Logging & Time
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
